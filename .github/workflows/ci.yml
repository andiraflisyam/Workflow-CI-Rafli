name: CI - Heart Disease MLflow Training

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Bisa dipicu manual dari GitHub UI

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn

      # ── 4. Jalankan MLflow Project ────────────────────────────
      - name: Run MLflow Project (Training)
        run: |
          mlflow run MLProject --env-manager=local -P n_estimators=100 -P max_depth=10 -P min_samples_split=2 -P random_state=42

      # ── 5. Simpan artefak MLflow ke GitHub ────────────────────
      - name: Upload MLflow Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: |
            mlruns/
            confusion_matrix.png
            feature_importance.png
            classification_report.txt
          retention-days: 30

      # ── 6. Tampilkan ringkasan hasil ──────────────────────────
      - name: Display Training Summary
        run: |
          echo "======================================"
          echo "  Training selesai!"
          echo "  Run number: ${{ github.run_number }}"
          echo "  Commit: ${{ github.sha }}"
          echo "======================================"
          ls -la mlruns/ 2>/dev/null || echo "mlruns tidak ditemukan"
